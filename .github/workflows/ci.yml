name: ci

on:
  push:
  pull_request:

jobs:
  coordination:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Coordination module tests (main protection, claims, hooks)
        run: python -m unittest discover -s tools/agent-coordination/tests -v
      - name: Docs checks fixtures
        run: python -m unittest discover -s tools/checks/tests -v
      - name: Agent-asset sync tests
        run: python -m unittest discover -s tools/agent-assets/tests -v
      - name: PR-review monitor self-check
        run: python -m unittest discover -s tools/pr-monitor/tests -v
      - name: Agent-asset drift (check-only)
        run: python tools/agent-assets/sync.py --check
      - name: Documentation checks
        run: python tools/checks/docs_checks.py --root . --baseline origin/main

  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Restore
        run: dotnet restore AutoGIS.Civil3D.sln --locked-mode
      - name: Build
        run: dotnet build AutoGIS.Civil3D.sln -c Release --no-restore
      - name: Test
        run: dotnet test AutoGIS.Civil3D.sln -c Release --no-build
      - name: Formatting
        # No --no-restore: dotnet format loads its own MSBuildWorkspace, and
        # skipping restore makes that load depend on prior steps' on-disk state,
        # which races on windows-latest (issue #49: exit 1, green on rerun).
        run: dotnet format AutoGIS.Civil3D.sln --verify-no-changes
      - name: Diagnostic package validation
        run: python diagnostics/AutoGIS.Civil3D.Diagnostics/tests/validate_package.py
      - name: Diagnostic Windows wrapper validation
        run: python diagnostics/AutoGIS.Civil3D.Diagnostics/tests/validate_windows_scripts.py
